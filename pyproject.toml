[project]
name = "yt-descargar"
version = "0.012"
description = "Local YouTube and YouTube Music downloader, tagger and media library"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = [".venv", "ffmpeg_portable"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
