name: release-check

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Verificar que el tag coincide con la versión
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: python -c "import os; from ymd.version import RELEASE_TAG; actual=os.environ['GIT_TAG']; assert actual == RELEASE_TAG, f'Tag {actual!r} != {RELEASE_TAG!r}'"
      - run: python -m unittest discover -s tests -v
      - run: ruff check app_playlist.py ymd tests
